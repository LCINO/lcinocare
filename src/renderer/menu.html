<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LcinoCare Menu</title>
  <link rel="stylesheet" href="menu.css" />
</head>
<body>
  <div class="pop">
    <div class="pop-head">
      <img src="assets/img/logo.svg" alt="" width="18" height="18" />
      <span class="pop-name">Lcino<b>Care</b></span>
      <span class="pop-cap">Menu</span>
    </div>

    <button class="upd-chip hidden" id="upd-chip">
      <span class="uc-dot"></span>
      <span>LcinoCare <b id="upd-ver"></b> is out</span>
      <span class="uc-arrow">Get it →</span>
    </button>

    <div class="metrics">
      <div class="metric">
        <div class="m-top"><span>CPU</span><b id="m-cpu">—</b></div>
        <div class="m-bar"><div id="b-cpu" style="width:0%"></div></div>
      </div>
      <div class="metric">
        <div class="m-top"><span>Memory</span><b id="m-mem">—</b></div>
        <div class="m-bar"><div id="b-mem" style="width:0%"></div></div>
      </div>
      <div class="metric">
        <div class="m-top"><span>Disk free</span><b id="m-disk">—</b></div>
        <div class="m-bar"><div id="b-disk" style="width:0%"></div></div>
      </div>
    </div>

    <div class="actions">
      <button class="act primary" id="a-clean">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.4" fill="currentColor"/><circle cx="12" cy="12" r="3.2" fill="#a4068a"/></svg>
        <span id="a-clean-t">Quick Clean</span>
      </button>
      <button class="act" id="a-ram">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M13.4 3.4L5.8 13.6h4.6l-.8 7 7.6-10.2h-4.7z" fill="currentColor"/></svg>
        Flush RAM
      </button>
      <button class="act" id="a-trash">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5.5 7h13M10 7V5.2A1.2 1.2 0 0 1 11.2 4h1.6A1.2 1.2 0 0 1 14 5.2V7m3.5 0l-.8 11.2a2 2 0 0 1-2 1.8H9.3a2 2 0 0 1-2-1.8L6.5 7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="a-trash-t">Empty Trash</span>
      </button>
      <button class="act" id="a-open">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="4" y="5.4" width="16" height="11" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M9.5 19.5h5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        Open App
      </button>
    </div>

    <div class="status" id="status">Live metrics update every 3 seconds.</div>
    <div class="pop-foot">
      <span id="ver">LcinoCare</span>
      <span class="foot-hint">Esc to close</span>
    </div>
  </div>
  <script src="menu.js"></script>
</body>
</html>
