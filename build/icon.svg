<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- A · Glossy MacBook with a heartbeat on screen, on a magenta squircle -->
  <defs>
    <linearGradient id="bg" x1="140" y1="80" x2="884" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff5fd2"/><stop offset=".55" stop-color="#c41fbf"/><stop offset="1" stop-color="#5a0a8c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lid" x1="260" y1="270" x2="760" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#ead9f5"/>
    </linearGradient>
    <linearGradient id="screen" x1="300" y1="310" x2="720" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a0846"/><stop offset="1" stop-color="#14001f"/>
    </linearGradient>
    <linearGradient id="base" x1="200" y1="650" x2="820" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6eefc"/><stop offset="1" stop-color="#cdb6e0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="330" y1="0" x2="690" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff7ae0"/><stop offset="1" stop-color="#ffd0f4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#2a0040" flood-opacity=".45"/>
    </filter>
    <filter id="neon"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <path d="M160 300 C 300 170 724 170 864 300 C 724 222 300 222 160 300 Z" fill="#fff" opacity=".18"/>
  <g filter="url(#soft)">
    <rect x="262" y="270" width="500" height="352" rx="34" fill="url(#lid)"/>
    <rect x="292" y="300" width="440" height="292" rx="16" fill="url(#screen)"/>
    <path d="M196 642 h632 a14 14 0 0 1 14 14 v8 c0 26 -22 46 -48 46 H230 c-26 0 -48 -20 -48 -46 v-8 a14 14 0 0 1 14 -14 z" fill="url(#base)"/>
    <rect x="452" y="642" width="120" height="16" rx="8" fill="#b79acd"/>
  </g>
  <path d="M330 450 h96 l30 -62 l48 132 l38 -96 l26 26 h102" stroke="#ff4fd2" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)" opacity=".8"/>
  <path d="M330 450 h96 l30 -62 l48 132 l38 -96 l26 26 h102" stroke="url(#pulse)" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
